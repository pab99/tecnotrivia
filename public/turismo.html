let _lang = 'es';

function cambiarIdioma(lang) {
    _lang = lang;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('activo', b.dataset.lang === lang));
    const ui = _ui[lang];
    document.getElementById('hdr-titulo').textContent = ui.titulo;
    document.getElementById('hdr-subtitulo').textContent = ui.subtitulo;
    renderGrid();
}

function renderGrid() {
    const grid = document.getElementById('grid-lugares');
    const ui = _ui[_lang];
    grid.innerHTML = _lugares[_lang].map((l, i) => `
        <div class="tarjeta${l.destacada?' destacada':''}" onclick="verLugar(${i})">
            ${l.destacada?`<span class="badge-top">${ui.destacado}</span><br>`:''}
            <span class="emoji">${l.emoji}</span>
            <h2>${l.nombre}</h2>
            <p class="descripcion">${l.descripcion}</p>
            <div class="tags">${l.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
            <button class="btn-ver">${ui.ver} →</button>
        </div>`).join('');
}

function verLugar(idx) {
    const l = _lugares[_lang][idx];
    const ui = _ui[_lang];
    document.getElementById('modal-contenido').innerHTML = `
        <span class="emoji-grande">${l.emoji}</span>
        <h2>${l.nombre}</h2>
        <p class="origen">📍 ${l.ubicacion}</p>
        <div class="info-grid">
            <div class="info-item"><div class="lbl">${ui.comoLlegar}</div><div class="val" style="font-size:0.82rem;font-weight:600">${l.comoLlegar}</div></div>
            <div class="info-item"><div class="lbl">${ui.entrada}</div><div class="val" style="font-size:0.82rem;font-weight:600">${l.entrada}</div></div>
            <div class="info-item"><div class="lbl">${ui.horarios}</div><div class="val" style="font-size:0.82rem;font-weight:600">${l.horarios}</div></div>
            <div class="info-item"><div class="lbl">${ui.mejorEpoca}</div><div class="val" style="font-size:0.82rem;font-weight:600">${l.mejorEpoca}</div></div>
        </div>
        <h3>${ui.atracciones}</h3>
        <ul>${l.atracciones.map(a=>`<li>${a}</li>`).join('')}</ul>
        <h3>${ui.consejos}</h3>
        <ul>${l.consejos.map(c=>`<li>${c}</li>`).join('')}</ul>
        <a class="btn-maps" href="${l.mapa}" target="_blank">${ui.verMapa}</a>
        <button class="btn-cerrar" onclick="cerrarModal()">${ui.cerrar}</button>`;
    document.getElementById('overlay').classList.add('activo');
    document.body.style.overflow='hidden';
}

function cerrarModal(e) {
    if(!e||e.target===document.getElementById('overlay')||e.target.classList.contains('btn-cerrar')) {
        document.getElementById('overlay').classList.remove('activo');
        document.body.style.overflow='';
    }
}
renderGrid();
</script>
