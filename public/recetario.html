<!DOCTYPE html>
<html lang="es">
<head>

    <style>
        :root {
            --azul-oscuro: #0d2c54;
            --azul-medio: #1a4a7a;

        header {
            text-align: center;
            padding: 28px 20px 16px;
        }
        header img.logo-prov {

            width: auto;
            display: block;
            margin: 0 auto 10px;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));

        header h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.8rem;
            color: var(--amarillo);
            letter-spacing: 3px;
            line-height: 1;
            text-shadow: 0 2px 12px rgba(253,216,53,0.3);
        }
        header p.subtitulo {
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* ── SELECTOR DE IDIOMAS ── */
        .lang-selector {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 14px 0 20px;
        }
        .lang-btn {
            font-size: 1.8rem;
            background: none;
            border: 2.5px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            padding: 5px 8px;
            line-height: 1;
            transition: all 0.15s;
            opacity: 0.45;
        }
        .lang-btn.activo {
            border-color: var(--amarillo);
            opacity: 1;
            background: rgba(253,216,53,0.15);
            transform: scale(1.18);
        }
        .lang-btn:hover { opacity: 1; }

        .contenedor {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px 40px;
        }
        .grid-recetas {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 22px;
        }
        .tarjeta {
            background: var(--blanco);
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 8px 28px rgba(0,0,0,0.25);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }
        .tarjeta:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 36px rgba(0,0,0,0.35);
        }

            font-size: 2.4rem;
            display: block;
            margin-bottom: 10px;
        }
        .tarjeta h2 {
            font-size: 1.25rem;
            font-weight: 900;
            color: var(--azul-oscuro);
            margin-bottom: 6px;
        }
        .tarjeta .descripcion {
            font-size: 0.88rem;
            color: #546e7a;
            line-height: 1.5;
            margin-bottom: 14px;
        }
        .tarjeta .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 14px;
        }
        .tag {
            background: #e3f2fd;
            color: var(--azul-medio);
            font-size: 0.73rem;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-ver {
            display: inline-block;
            background: var(--azul-oscuro);
            color: var(--amarillo);
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 0.82rem;
            padding: 8px 18px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: background 0.15s;
        }
        .btn-ver:hover { background: var(--azul-medio); }

        /* ── MODAL ── */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(13,44,84,0.82);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .overlay.activo { display: flex; }
        .modal {
            background: var(--blanco);
            border-radius: 22px;
            max-width: 600px;
            width: 100%;
            max-height: 88vh;
            overflow-y: auto;
            padding: 28px;
            position: relative;

            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: var(--azul-oscuro);

            border: none;

    </style>
</head>

let _langActual = 'es';
let _recetaActual = null;

function cambiarIdioma(lang) {
    _langActual = lang;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('activo', b.dataset.lang === lang));
    const ui = _ui[lang];
    document.getElementById('hdr-titulo').textContent = ui.titulo;
    document.getElementById('hdr-subtitulo').textContent = ui.subtitulo;
    renderGrid();
}

function renderGrid() {
    const grid = document.getElementById('grid-recetas');
    const recetas = _recetas[_langActual];
    const ui = _ui[_langActual];
    grid.innerHTML = recetas.map((r, i) => `
        <div class="tarjeta" onclick="verReceta(${i})">
            <span class="emoji">${r.emoji}</span>
            <h2>${r.nombre}</h2>
            <p class="descripcion">${r.descripcion}</p>
            <div class="tags">${r.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
            <button class="btn-ver">${ui.ver} →</button>
        </div>
    `).join('');
}

function verReceta(idx) {
    const r = _recetas[_langActual][idx];
    const ui = _ui[_langActual];
    const modal = document.getElementById('modal-contenido');
    modal.innerHTML = `
        <span class="emoji-grande">${r.emoji}</span>
        <h2>${r.nombre}</h2>
        <p class="origen">${r.origen}</p>
        <h3>${ui.ingredientes}</h3>
        <ul>${r.ingredientes.map(i => `<li>${i}</li>`).join('')}</ul>
        <h3>${ui.preparacion}</h3>
        <ol>${r.preparacion.map(p => `<li>${p}</li>`).join('')}</ol>
        <button class="btn-cerrar" onclick="cerrarModal()">${ui.cerrar}</button>
    `;
    document.getElementById('overlay').classList.add('activo');
    document.body.style.overflow = 'hidden';
}

function cerrarModal(e) {
    if (!e || e.target === document.getElementById('overlay') || e.target.classList.contains('btn-cerrar')) {
        document.getElementById('overlay').classList.remove('activo');
        document.body.style.overflow = '';
    }
}

renderGrid();
</script>
