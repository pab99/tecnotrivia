    <style>
        :root { --azul-oscuro:#0d2c54; --azul-medio:#1a4a7a; --amarillo:#fdd835; --blanco:#ffffff; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:'Nunito',sans-serif; background:linear-gradient(160deg,#0d2c54 0%,#1a4a7a 45%,#0d2c54 100%); min-height:100vh; color:var(--azul-oscuro); }
        header { text-align:center; padding:28px 20px 16px; }
        header img.logo-prov { height:110px; width:auto; display:block; margin:0 auto 10px; filter:drop-shadow(0 4px 12px rgba(0,0,0,0.3)); }
        header h1 { font-family:'Bebas Neue',sans-serif; font-size:2.8rem; color:var(--amarillo); letter-spacing:3px; line-height:1; text-shadow:0 2px 12px rgba(253,216,53,0.3); }
        header p.subtitulo { color:rgba(255,255,255,0.7); font-size:0.85rem; font-weight:700; letter-spacing:3px; text-transform:uppercase; margin-top:4px; }
        .lang-selector { display:flex; justify-content:center; gap:12px; padding:14px 0 20px; }
        .lang-btn { font-size:1.8rem; background:none; border:2.5px solid transparent; border-radius:10px; cursor:pointer; padding:5px 8px; line-height:1; transition:all 0.15s; opacity:0.45; }
        .lang-btn.activo { border-color:var(--amarillo); opacity:1; background:rgba(253,216,53,0.15); transform:scale(1.18); }
        .lang-btn:hover { opacity:1; }
        .contenedor { max-width:1100px; margin:0 auto; padding:0 20px 40px; }
        .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:22px; }
        .tarjeta { background:var(--blanco); border-radius:18px; padding:22px; box-shadow:0 8px 28px rgba(0,0,0,0.25); cursor:pointer; transition:transform 0.2s,box-shadow 0.2s; }
        .tarjeta:hover { transform:translateY(-4px); box-shadow:0 14px 36px rgba(0,0,0,0.35); }
        .tarjeta .emoji { font-size:2.4rem; display:block; margin-bottom:10px; }
        .tarjeta.destacada { border:3px solid var(--amarillo); background:linear-gradient(135deg,#fffde7,#fff9c4); }
        .badge-top { display:inline-block; background:var(--amarillo); color:var(--azul-oscuro); font-size:0.7rem; font-weight:900; padding:3px 10px; border-radius:20px; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
        .tarjeta h2 { font-size:1.2rem; font-weight:900; color:var(--azul-oscuro); margin-bottom:4px; }
        .tarjeta .artista { font-size:0.82rem; font-weight:700; color:var(--azul-medio); margin-bottom:8px; }
        .tarjeta .descripcion { font-size:0.88rem; color:#546e7a; line-height:1.5; margin-bottom:14px; }
        .tarjeta .tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
        .tag { background:#e3f2fd; color:var(--azul-medio); font-size:0.73rem; font-weight:700; padding:3px 9px; border-radius:20px; text-transform:uppercase; }
        .btn-ver { display:inline-block; background:var(--azul-oscuro); color:var(--amarillo); font-family:'Nunito',sans-serif; font-weight:800; font-size:0.82rem; padding:8px 18px; border-radius:10px; border:none; cursor:pointer; transition:background 0.15s; }
        .btn-ver:hover { background:var(--azul-medio); }
        .overlay { display:none; position:fixed; inset:0; background:rgba(13,44,84,0.82); z-index:100; align-items:center; justify-content:center; padding:20px; }
        .overlay.activo { display:flex; }
        .modal { background:var(--blanco); border-radius:22px; max-width:620px; width:100%; max-height:88vh; overflow-y:auto; padding:28px; }
        .modal .emoji-grande { font-size:3rem; display:block; margin-bottom:8px; }
        .modal h2 { font-size:1.6rem; font-weight:900; color:var(--azul-oscuro); margin-bottom:2px; }
        .modal .artista-modal { font-size:1rem; font-weight:700; color:var(--azul-medio); margin-bottom:14px; }
        .modal h3 { font-size:1rem; font-weight:800; color:var(--azul-medio); margin:16px 0 8px; text-transform:uppercase; letter-spacing:1px; }
        .modal p { font-size:0.92rem; color:#333; line-height:1.65; margin-bottom:10px; }
        .modal ul { padding-left:18px; }
        .modal ul li { font-size:0.92rem; color:#333; margin-bottom:6px; line-height:1.5; }
        .btn-youtube { display:block; width:100%; padding:13px; background:#ff0000; color:#fff; font-family:'Nunito',sans-serif; font-weight:800; font-size:0.95rem; border:none; border-radius:12px; cursor:pointer; margin-bottom:10px; text-align:center; text-decoration:none; }
        .btn-youtube:hover { background:#cc0000; }
        .btn-cerrar { display:block; width:100%; margin-top:6px; padding:12px; background:var(--azul-oscuro); color:var(--amarillo); font-family:'Nunito',sans-serif; font-weight:800; font-size:1rem; border:none; border-radius:12px; cursor:pointer; }
        footer { text-align:center; padding:20px; color:rgba(255,255,255,0.35); font-size:0.78rem; display:flex; align-items:center; justify-content:center; gap:10px; }
        footer img { height:28px; width:auto; opacity:0.5; filter:brightness(10); }

        /* ─── BOTÓN VOLVER AL JUEGO ─── */
        .btn-volver-juego {
            display: block;
            width: 100%;
            max-width: 320px;
            margin: 0 auto 18px;
            padding: 13px 20px;
            background: var(--azul-oscuro);
            color: var(--amarillo);
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
            font-size: 1rem;
            text-align: center;
            text-decoration: none;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: background 0.15s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(13,44,84,0.3);
        }
        .btn-volver-juego:hover { background: var(--azul-medio); transform: translateY(-2px); }

        /* ─── BOTÓN SPOTIFY ─── */
        .btn-spotify {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 320px;
            margin: 0 auto 30px;
            padding: 13px 20px;
            background: #1DB954;
            color: #fff;
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
            font-size: 1rem;
            text-align: center;
            text-decoration: none;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: background 0.15s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(29,185,84,0.35);
        }
        .btn-spotify:hover { background: #17a349; transform: translateY(-2px); }
        .spotify-icon { width: 24px; height: 24px; flex-shrink: 0; }
    </style>
</head>

    pt:{titulo:'Música Santiaguina',subtitulo:'10 músicas imperdíveis do norte argentino',ver:'Ver história',cerrar:'Fechar',historia:'História',porQueEscluar:'Por que ouvir?',artistas:'Artistas relacionados',verYoutube:'▶ Ouvir no YouTube',destacado:'⭐ Imperdível'},

const _temas = {
    es:[
        {emoji:'🎸',nombre:'La Chacarera del Rancho',artista:'Los Hermanos Ábalos',destacada:true,descripcion:'El tema que define a Santiago del Estero en el mundo. Un himno de la chacarera santiagueña interpretado por el grupo más influyente del folclore.',tags:['chacarera','folclore','clásico'],historia:'Los Hermanos Ábalos, oriundos de Santiago del Estero, popularizaron esta pieza en los años 50. Fue el primer tema de chacarera en sonar en Buenos Aires y consagró al género a nivel nacional.',porQueEscuchar:'Porque es la chacarera más pura: guitarra, bombo leguero y voces que huelen a monte santiagueño. El ritmo te invita a bailar aunque no sepas cómo.',artistas:['Los Hermanos Ábalos','Peteco Carabajal','Chazarreta'],youtube:'https://www.youtube.com/results?search_query=Los+Hermanos+Abalos+La+Chacarera+del+Rancho'},
        {emoji:'🥁',nombre:'La Telesita',artista:'Carlos Carabajal',destacada:false,descripcion:'La leyenda santiagueña más famosa hecha canción. La historia de una mujer que bailó hasta morir y se convirtió en patrona de los bailarines.',tags:['chacarera','leyenda','Carabajal'],historia:'Carlos Carabajal compuso esta chacarera en los años 60 basándose en la leyenda popular de Telesita, una joven santiagueña que era poseída por el espíritu del baile. La canción se convirtió en una de las más versionadas del folclore argentino.',porQueEscuchar:'Por su historia mágica y su ritmo irresistible. Entendés por qué la chacarera es un trance cuando la escuchás bien.',artistas:['Carlos Carabajal','Peteco Carabajal','Los Carabajal'],youtube:'https://www.youtube.com/results?search_query=Carlos+Carabajal+La+Telesita'},
        {emoji:'🎵',nombre:'Añoranzas',artista:'Peteco Carabajal',destacada:false,descripcion:'La voz más contemporánea de Santiago del Estero. Un tema que captura la nostalgia del santiagueño migrante con una sensibilidad única.',tags:['chacarera','contemporáneo','nostalgia'],historia:'Peteco Carabajal, hijo del legendario Carlos, renovó el folclore santiagueño en los 80 y 90. Sus composiciones hablan del desarraigo, la tierra y el amor con un lenguaje poético que trascendió generaciones.',porQueEscuchar:'Por su poesía. Peteco es al folclore lo que Neruda a la poesía: transforma lo cotidiano en algo sublime.',artistas:['Peteco Carabajal','Los Carabajal','Raly Barrionuevo'],youtube:'https://www.youtube.com/results?search_query=Peteco+Carabajal+Añoranzas'},
        {emoji:'🎶',nombre:'La Salamanca',artista:'Divididos / Versión folclórica',destacada:false,descripcion:'La leyenda del pacto con el diablo en el monte chaqueño hecha canción. Una de las historias más oscuras y fascinantes del noroeste.',tags:['leyenda','rock-folclore','mística'],historia:'La Salamanca es una cueva mítica donde el diablo enseña a tocar instrumentos a cambio del alma. Divididos popularizó una versión rockera del mito santiagueño que fusionó géneros de manera memorable.',porQueEscuchar:'Por la energía única de cuando el folclore del norte se encuentra con el rock argentino. Una fusión que te electriza.',artistas:['Divididos','Los Manseros Santiagueños','Cuti Carabajal'],youtube:'https://www.youtube.com/results?search_query=Divididos+La+Salamanca+Santiago+del+Estero'},
        {emoji:'🪘',nombre:'El Humahuaqueño',artista:'Edmundo Zaldívar',destacada:false,descripcion:'El carnavalito más famoso de Argentina, creado por un santiagueño. Sonó en cada carnaval y acto escolar durante décadas.',tags:['carnavalito','clásico','escolar'],historia:'Compuesto por el santiagueño Edmundo Zaldívar en 1942, este carnavalito se convirtió en el más interpretado de Argentina. Llegó a los libros de música escolar de todo el país y sigue siendo un símbolo de la identidad andina.',porQueEscuchar:'Porque es literalmente parte del ADN musical argentino. Es imposible escucharlo sin mover los pies.',artistas:['Edmundo Zaldívar','Los Chalchaleros','Atahualpa Yupanqui'],youtube:'https://www.youtube.com/results?search_query=El+Humahuaqueño+carnavalito'},
        {emoji:'🎤',nombre:'Son del Pueblo',artista:'Los Manseros Santiagueños',destacada:false,descripcion:'El grupo más longevo del folclore santiagueño. Sus coplas y chacareras son la voz de los campesinos y paisanos del monte.',tags:['chacarera','copla','popular'],historia:'Los Manseros Santiagueños llevan más de 60 años de trayectoria ininterrumpida. Representaron a Santiago en festivales de todo el mundo y mantienen viva la tradición de la copla y la chacarera más purista.',porQueEscuchar:'Por su autenticidad total. Sin arreglos modernos, sin concesiones: chacarera pura como el agua del Río Dulce.',artistas:['Los Manseros Santiagueños','Los Ábalos','Cuti y Roberto Carabajal'],youtube:'https://www.youtube.com/results?search_query=Los+Manseros+Santiagueños'},
        {emoji:'🌵',nombre:'Zamba de mi Esperanza',artista:'Luis Profili / Jorge Cafrune',destacada:false,descripcion:'Una de las zambas más hermosas del repertorio folclórico. Aunque su autor vivió en Santiago, se convirtió en himno universal del noroeste.',tags:['zamba','clásico','himno'],historia:'Compuesta por Luis Profili, fue Jorge Cafrune quien la popularizó masivamente en los 60. La zamba habla de amor, tierra y esperanza con una melodía que permanece en la memoria para siempre.',porQueEscuchar:'Porque es imposible escucharla sin emocionarse. La melodía más bella del folclore argentino para mucha gente.',artistas:['Jorge Cafrune','Mercedes Sosa','Los Chalchaleros'],youtube:'https://www.youtube.com/results?search_query=Zamba+de+mi+Esperanza+Cafrune'},
        {emoji:'🎻',nombre:'Chacarera del Exilio',artista:'Cuti Carabajal',destacada:false,descripcion:'La chacarera del desarraigo y la migración. Un tema que habla del santiagueño que debe dejar su tierra para buscar trabajo en Buenos Aires.',tags:['chacarera','migración','identidad'],historia:'Cuti Carabajal compuso este tema en los años 70 cuando la migración interna argentina llevaba a miles de santiagueños a Buenos Aires. Se convirtió en el himno de los trasplantados que mantenían su identidad cultural.',porQueEscuchar:'Porque te habla de raíces, de identidad y de lo que significa llevar la tierra en el corazón aunque estés lejos.',artistas:['Cuti Carabajal','Roberto Carabajal','Peteco Carabajal'],youtube:'https://www.youtube.com/results?search_query=Cuti+Carabajal+Chacarera+del+Exilio'},
        {emoji:'🌟',nombre:'Llegando al Rancho',artista:'Raly Barrionuevo',destacada:false,descripcion:'La nueva generación del folclore santiagueño. Raly fusiona la chacarera con sonidos contemporáneos sin perder la identidad del monte.',tags:['chacarera','contemporáneo','fusión'],historia:'Raly Barrionuevo es la figura más importante del folclore santiagueño del siglo XXI. Sus producciones modernas han llevado la chacarera a un público joven que de otra manera no hubiera descubierto el género.',porQueEscuchar:'Para entender que el folclore no es cosa del pasado. Raly prueba que la chacarera puede ser tan moderna como cualquier género actual.',artistas:['Raly Barrionuevo','La Bruja Salguero','Peteco Carabajal'],youtube:'https://www.youtube.com/results?search_query=Raly+Barrionuevo+chacarera'},
        {emoji:'🏆',nombre:'Santiago del Estero',artista:'Hermanos Núñez',destacada:false,descripcion:'El himno no oficial de la provincia. Una chacarera que canta a la tierra, al río y al pueblo santiagueño con orgullo y emoción.',tags:['himno','chacarera','identidad'],historia:'Los Hermanos Núñez crearon este tema que se convirtió en identitario para los santiagueños de todo el país. Se canta en los actos provinciales, en los eventos folclóricos y en las peñas de Buenos Aires con la misma emoción.',porQueEscuchar:'Porque cuando la escuchás entendés por qué Santiago del Estero se llama a sí misma "Madre de Ciudades" y por qué sus habitantes la quieren tanto.',artistas:['Hermanos Núñez','Los Manseros','Los Ábalos'],youtube:'https://www.youtube.com/results?search_query=Hermanos+Núñez+Santiago+del+Estero+chacarera'}
    ],
    en:[
        {emoji:'🎸',nombre:'La Chacarera del Rancho',artista:'Los Hermanos Ábalos',destacada:true,descripcion:'The theme that defines Santiago del Estero worldwide. A hymn of Santiaguino chacarera performed by the most influential group in Argentine folklore.',tags:['chacarera','folklore','classic'],historia:'The Ábalos Brothers, from Santiago del Estero, popularized this piece in the 1950s. It was the first chacarera to play in Buenos Aires and established the genre nationally.',porQueEscuchar:'Because it is the purest chacarera: guitar, bombo leguero drum and voices that smell of the Santiaguine scrubland. The rhythm invites you to dance even if you don\'t know how.',artistas:['Los Hermanos Ábalos','Peteco Carabajal','Chazarreta'],youtube:'https://www.youtube.com/results?search_query=Los+Hermanos+Abalos+La+Chacarera+del+Rancho'},
        {emoji:'🥁',nombre:'La Telesita',artista:'Carlos Carabajal',destacada:false,descripcion:'The most famous Santiaguino legend made into a song. The story of a woman who danced herself to death and became the patron saint of dancers.',tags:['chacarera','legend','Carabajal'],historia:'Carlos Carabajal composed this chacarera in the 1960s based on the popular legend of Telesita, a young woman from Santiago del Estero possessed by the spirit of dance. The song became one of the most covered in Argentine folklore.',porQueEscuchar:'For its magical story and irresistible rhythm. You understand why chacarera is a trance when you really listen to it.',artistas:['Carlos Carabajal','Peteco Carabajal','Los Carabajal'],youtube:'https://www.youtube.com/results?search_query=Carlos+Carabajal+La+Telesita'},
        {emoji:'🎵',nombre:'Añoranzas',artista:'Peteco Carabajal',destacada:false,descripcion:'The most contemporary voice of Santiago del Estero. A theme that captures the nostalgia of the migrant Santiaguino with unique sensitivity.',tags:['chacarera','contemporary','nostalgia'],historia:'Peteco Carabajal, son of the legendary Carlos, renewed Santiaguino folklore in the 80s and 90s. His compositions speak of displacement, land and love with a poetic language that transcended generations.',porQueEscuchar:'For its poetry. Peteco is to folklore what Neruda is to poetry: transforms the everyday into something sublime.',artistas:['Peteco Carabajal','Los Carabajal','Raly Barrionuevo'],youtube:'https://www.youtube.com/results?search_query=Peteco+Carabajal+Añoranzas'},
        {emoji:'🎶',nombre:'La Salamanca',artista:'Divididos / Folk version',destacada:false,descripcion:'The legend of the pact with the devil in the Chaco scrubland made into a song. One of the darkest and most fascinating stories of the northwest.',tags:['legend','rock-folklore','mystic'],historia:'La Salamanca is a mythical cave where the devil teaches instruments in exchange for the soul. Divididos popularized a rock version of the Santiaguino myth that fused genres memorably.',porQueEscuchar:'For the unique energy when northern folklore meets Argentine rock. A fusion that electrifies you.',artistas:['Divididos','Los Manseros Santiagueños','Cuti Carabajal'],youtube:'https://www.youtube.com/results?search_query=Divididos+La+Salamanca+Santiago+del+Estero'},
        {emoji:'🪘',nombre:'El Humahuaqueño',artista:'Edmundo Zaldívar',destacada:false,descripcion:"Argentina's most famous carnavalito, created by a Santiaguino. Played at every carnival and school ceremony for decades.",tags:['carnavalito','classic','school'],historia:'Composed by Santiaguino Edmundo Zaldívar in 1942, this carnavalito became the most performed in Argentina. It reached school music books throughout the country and remains a symbol of Andean identity.',porQueEscuchar:"Because it's literally part of Argentina's musical DNA. Impossible to hear without moving your feet.",artistas:['Edmundo Zaldívar','Los Chalchaleros','Atahualpa Yupanqui'],youtube:'https://www.youtube.com/results?search_query=El+Humahuaqueño+carnavalito'},
        {emoji:'🎤',nombre:'Son del Pueblo',artista:'Los Manseros Santiagueños',destacada:false,descripcion:'The longest-running group in Santiaguino folklore. Their coplas and chacareras are the voice of the campesinos and country people of the scrubland.',tags:['chacarera','copla','popular'],historia:'Los Manseros Santiagueños have over 60 years of uninterrupted career. They represented Santiago at festivals worldwide and keep alive the tradition of the copla and the purist chacarera.',porQueEscuchar:'For their total authenticity. No modern arrangements, no concessions: pure chacarera like the water of the Río Dulce.',artistas:['Los Manseros Santiagueños','Los Ábalos','Cuti y Roberto Carabajal'],youtube:'https://www.youtube.com/results?search_query=Los+Manseros+Santiagueños'},
        {emoji:'🌵',nombre:'Zamba de mi Esperanza',artista:'Luis Profili / Jorge Cafrune',destacada:false,descripcion:'One of the most beautiful zambas in the folkloric repertoire. Though its author lived in Santiago, it became a universal hymn of the northwest.',tags:['zamba','classic','hymn'],historia:'Composed by Luis Profili, it was Jorge Cafrune who massively popularized it in the 60s. The zamba speaks of love, land and hope with a melody that stays in memory forever.',porQueEscuchar:"Because it's impossible to hear without being moved. The most beautiful melody in Argentine folklore for many people.",artistas:['Jorge Cafrune','Mercedes Sosa','Los Chalchaleros'],youtube:'https://www.youtube.com/results?search_query=Zamba+de+mi+Esperanza+Cafrune'},
        {emoji:'🎻',nombre:'Chacarera del Exilio',artista:'Cuti Carabajal',destacada:false,descripcion:'The chacarera of displacement and migration. A theme about the Santiaguino who must leave their land to find work in Buenos Aires.',tags:['chacarera','migration','identity'],historia:'Cuti Carabajal composed this in the 70s when internal Argentine migration took thousands of Santiaguinos to Buenos Aires. It became the anthem of the transplanted who maintained their cultural identity.',porQueEscuchar:'Because it speaks of roots, identity and what it means to carry your land in your heart even when far away.',artistas:['Cuti Carabajal','Roberto Carabajal','Peteco Carabajal'],youtube:'https://www.youtube.com/results?search_query=Cuti+Carabajal+Chacarera+del+Exilio'},
        {emoji:'🌟',nombre:'Llegando al Rancho',artista:'Raly Barrionuevo',destacada:false,descripcion:'The new generation of Santiaguino folklore. Raly fuses chacarera with contemporary sounds without losing the identity of the scrubland.',tags:['chacarera','contemporary','fusion'],historia:'Raly Barrionuevo is the most important figure in 21st-century Santiaguino folklore. His modern productions have brought chacarera to a young audience that otherwise would not have discovered the genre.',porQueEscuchar:'To understand that folklore is not a thing of the past. Raly proves chacarera can be as modern as any current genre.',artistas:['Raly Barrionuevo','La Bruja Salguero','Peteco Carabajal'],youtube:'https://www.youtube.com/results?search_query=Raly+Barrionuevo+chacarera'},
        {emoji:'🏆',nombre:'Santiago del Estero',artista:'Hermanos Núñez',destacada:false,descripcion:"The province's unofficial anthem. A chacarera that sings of the land, the river and the Santiaguino people with pride and emotion.",tags:['anthem','chacarera','identity'],historia:'The Núñez Brothers created this theme that became identity-defining for Santiaguinos across the country. It is sung at provincial events and folklore festivals with the same emotion.',porQueEscuchar:'Because when you hear it you understand why Santiago del Estero calls itself "Mother of Cities" and why its people love it so much.',artistas:['Hermanos Núñez','Los Manseros','Los Ábalos'],youtube:'https://www.youtube.com/results?search_query=Hermanos+Núñez+Santiago+del+Estero+chacarera'}
    ],
    fr:[
        {emoji:'🎸',nombre:'La Chacarera del Rancho',artista:'Los Hermanos Ábalos',destacada:true,descripcion:'Le morceau qui définit Santiago del Estero dans le monde. Un hymne de la chacarera santiaguine interprété par le groupe le plus influent du folklore.',tags:['chacarera','folklore','classique'],historia:'Les Frères Ábalos, originaires de Santiago del Estero, ont popularisé ce morceau dans les années 50. Ce fut la première chacarera à jouer à Buenos Aires et a consacré le genre au niveau national.',porQueEscuchar:'Parce que c\'est la chacarera la plus pure : guitare, bombo leguero et voix qui sentent le monte santiaguino. Le rythme vous invite à danser même si vous ne savez pas comment.',artistas:['Los Hermanos Ábalos','Peteco Carabajal','Chazarreta'],youtube:'https://www.youtube.com/results?search_query=Los+Hermanos+Abalos+La+Chacarera+del+Rancho'},
        {emoji:'🥁',nombre:'La Telesita',artista:'Carlos Carabajal',destacada:false,descripcion:'La légende santiaguine la plus célèbre en chanson. L\'histoire d\'une femme qui a dansé jusqu\'à la mort et est devenue la patronne des danseurs.',tags:['chacarera','légende','Carabajal'],historia:'Carlos Carabajal a composé cette chacarera dans les années 60 sur la légende populaire de Telesita, une jeune femme possédée par l\'esprit de la danse. La chanson est devenue l\'une des plus reprises du folklore argentin.',porQueEscuchar:'Pour son histoire magique et son rythme irrésistible. Vous comprenez pourquoi la chacarera est une transe quand vous l\'écoutez vraiment.',artistas:['Carlos Carabajal','Peteco Carabajal','Los Carabajal'],youtube:'https://www.youtube.com/results?search_query=Carlos+Carabajal+La+Telesita'},
        {emoji:'🎵',nombre:'Añoranzas',artista:'Peteco Carabajal',destacada:false,descripcion:'La voix la plus contemporaine de Santiago del Estero. Un morceau qui capture la nostalgie du Santiaguino migrant avec une sensibilité unique.',tags:['chacarera','contemporain','nostalgie'],historia:'Peteco Carabajal, fils du légendaire Carlos, a renouvelé le folklore santiaguino dans les années 80-90. Ses compositions parlent du déracinement, de la terre et de l\'amour avec un langage poétique qui a transcendé les générations.',porQueEscuchar:'Pour sa poésie. Peteco est au folklore ce que Neruda est à la poésie : il transforme le quotidien en quelque chose de sublime.',artistas:['Peteco Carabajal','Los Carabajal','Raly Barrionuevo'],youtube:'https://www.youtube.com/results?search_query=Peteco+Carabajal+Añoranzas'},
        {emoji:'🎶',nombre:'La Salamanca',artista:'Divididos / version folklorique',destacada:false,descripcion:'La légende du pacte avec le diable dans le monte chaqueño en chanson. Une des histoires les plus sombres et fascinantes du nord-ouest.',tags:['légende','rock-folklore','mystique'],historia:'La Salamanca est une grotte mythique où le diable enseigne la musique en échange de l\'âme. Divididos a popularisé une version rock du mythe santiaguino qui a fusionné les genres de manière mémorable.',porQueEscuchar:'Pour l\'énergie unique quand le folklore du nord rencontre le rock argentin. Une fusion qui vous électrise.',artistas:['Divididos','Los Manseros Santiagueños','Cuti Carabajal'],youtube:'https://www.youtube.com/results?search_query=Divididos+La+Salamanca+Santiago+del+Estero'},
        {emoji:'🪘',nombre:'El Humahuaqueño',artista:'Edmundo Zaldívar',destacada:false,descripcion:'Le carnavalito le plus célèbre d\'Argentine, créé par un Santiaguino. Joué à chaque carnaval et cérémonie scolaire pendant des décennies.',tags:['carnavalito','classique','scolaire'],historia:'Composé par Edmundo Zaldívar en 1942, ce carnavalito est devenu le plus interprété d\'Argentine. Il a atteint les livres de musique scolaire de tout le pays.',porQueEscuchar:'Parce que c\'est littéralement une partie de l\'ADN musical argentin. Impossible de l\'écouter sans bouger les pieds.',artistas:['Edmundo Zaldívar','Los Chalchaleros','Atahualpa Yupanqui'],youtube:'https://www.youtube.com/results?search_query=El+Humahuaqueño+carnavalito'},
        {emoji:'🎤',nombre:'Son del Pueblo',artista:'Los Manseros Santiagueños',destacada:false,descripcion:'Le groupe le plus ancien du folklore santiaguino. Leurs coplas et chacareras sont la voix des paysans du monte.',tags:['chacarera','copla','populaire'],historia:'Los Manseros Santiagueños ont plus de 60 ans de carrière ininterrompue. Ils ont représenté Santiago dans des festivals du monde entier.',porQueEscuchar:'Pour leur authenticité totale. Sans arrangements modernes : chacarera pure comme l\'eau du Río Dulce.',artistas:['Los Manseros Santiagueños','Los Ábalos','Cuti y Roberto Carabajal'],youtube:'https://www.youtube.com/results?search_query=Los+Manseros+Santiagueños'},
        {emoji:'🌵',nombre:'Zamba de mi Esperanza',artista:'Luis Profili / Jorge Cafrune',destacada:false,descripcion:'Une des plus belles zambas du répertoire folklorique. Un hymne universel du nord-ouest argentin.',tags:['zamba','classique','hymne'],historia:'Composée par Luis Profili, c\'est Jorge Cafrune qui l\'a massivement popularisée dans les années 60. La zamba parle d\'amour, de terre et d\'espoir avec une mélodie inoubliable.',porQueEscuchar:'Parce qu\'il est impossible de l\'écouter sans être ému. La plus belle mélodie du folklore argentin pour beaucoup.',artistas:['Jorge Cafrune','Mercedes Sosa','Los Chalchaleros'],youtube:'https://www.youtube.com/results?search_query=Zamba+de+mi+Esperanza+Cafrune'},
        {emoji:'🎻',nombre:'Chacarera del Exilio',artista:'Cuti Carabajal',destacada:false,descripcion:'La chacarera du déracinement et de la migration. Un morceau sur le Santiaguino qui doit quitter sa terre pour trouver du travail à Buenos Aires.',tags:['chacarera','migration','identité'],historia:'Cuti Carabajal a composé ce morceau dans les années 70 quand la migration interne amenait des milliers de Santiaguinos à Buenos Aires. Il est devenu l\'hymne des transplantés.',porQueEscuchar:'Parce qu\'il parle de racines, d\'identité et de ce que signifie porter sa terre dans son cœur même loin.',artistas:['Cuti Carabajal','Roberto Carabajal','Peteco Carabajal'],youtube:'https://www.youtube.com/results?search_query=Cuti+Carabajal+Chacarera+del+Exilio'},
        {emoji:'🌟',nombre:'Llegando al Rancho',artista:'Raly Barrionuevo',destacada:false,descripcion:'La nouvelle génération du folklore santiaguino. Raly fusionne la chacarera avec des sonorités contemporaines sans perdre l\'identité du monte.',tags:['chacarera','contemporain','fusion'],historia:'Raly Barrionuevo est la figure la plus importante du folklore santiaguino du XXIe siècle. Ses productions modernes ont amené la chacarera à un jeune public.',porQueEscuchar:'Pour comprendre que le folklore n\'est pas une chose du passé. Raly prouve que la chacarera peut être aussi moderne que n\'importe quel genre actuel.',artistas:['Raly Barrionuevo','La Bruja Salguero','Peteco Carabajal'],youtube:'https://www.youtube.com/results?search_query=Raly+Barrionuevo+chacarera'},
        {emoji:'🏆',nombre:'Santiago del Estero',artista:'Hermanos Núñez',destacada:false,descripcion:'L\'hymne non officiel de la province. Une chacarera qui chante la terre, le fleuve et le peuple santiaguino avec fierté et émotion.',tags:['hymne','chacarera','identité'],historia:'Les Frères Núñez ont créé ce morceau devenu identitaire pour les Santiaguinos de tout le pays. Il est chanté lors des événements provinciaux et des festivals folkloriques.',porQueEscuchar:'Parce qu\'en l\'écoutant vous comprenez pourquoi Santiago del Estero s\'appelle elle-même "Mère des Villes".',artistas:['Hermanos Núñez','Los Manseros','Los Ábalos'],youtube:'https://www.youtube.com/results?search_query=Hermanos+Núñez+Santiago+del+Estero+chacarera'}

    pt:[
        {emoji:'🎸',nombre:'La Chacarera del Rancho',artista:'Los Hermanos Ábalos',destacada:true,descripcion:'O tema que define Santiago del Estero no mundo. Um hino da chacarera santiaguina interpretado pelo grupo mais influente do folclore.',tags:['chacarera','folclore','clássico'],historia:'Os Irmãos Ábalos, de Santiago del Estero, popularizaram esta peça nos anos 50. Foi a primeira chacarera a tocar em Buenos Aires e consagrou o gênero a nível nacional.',porQueEscuchar:'Porque é a chacarera mais pura: violão, bombo leguero e vozes que cheiram ao monte santiaguino. O ritmo convida a dançar mesmo sem saber como.',artistas:['Los Hermanos Ábalos','Peteco Carabajal','Chazarreta'],youtube:'https://www.youtube.com/results?search_query=Los+Hermanos+Abalos+La+Chacarera+del+Rancho'},
        {emoji:'🥁',nombre:'La Telesita',artista:'Carlos Carabajal',destacada:false,descripcion:'A lenda santiaguina mais famosa em forma de canção. A história de uma mulher que dançou até a morte e se tornou padroeira dos dançarinos.',tags:['chacarera','lenda','Carabajal'],historia:'Carlos Carabajal compôs esta chacarera nos anos 60 baseando-se na lenda popular de Telesita, uma jovem possuída pelo espírito da dança. A canção tornou-se uma das mais regravadas do folclore argentino.',porQueEscuchar:'Pela sua história mágica e ritmo irresistível. Você entende por que a chacarera é um transe quando a ouve de verdade.',artistas:['Carlos Carabajal','Peteco Carabajal','Los Carabajal'],youtube:'https://www.youtube.com/results?search_query=Carlos+Carabajal+La+Telesita'},
        {emoji:'🎵',nombre:'Añoranzas',artista:'Peteco Carabajal',destacada:false,descripcion:'A voz mais contemporânea de Santiago del Estero. Um tema que captura a nostalgia do santiaguino migrante com sensibilidade única.',tags:['chacarera','contemporâneo','nostalgia'],historia:'Peteco Carabajal, filho do lendário Carlos, renovou o folclore santiaguino nos anos 80 e 90. Suas composições falam de desenraizamento, terra e amor com linguagem poética que transcendeu gerações.',porQueEscuchar:'Pela sua poesia. Peteco é para o folclore o que Neruda é para a poesia: transforma o cotidiano em algo sublime.',artistas:['Peteco Carabajal','Los Carabajal','Raly Barrionuevo'],youtube:'https://www.youtube.com/results?search_query=Peteco+Carabajal+Añoranzas'},
        {emoji:'🎶',nombre:'La Salamanca',artista:'Divididos / versão folclórica',destacada:false,descripcion:'A lenda do pacto com o diabo no monte chaqueño em forma de canção. Uma das histórias mais sombrias e fascinantes do noroeste.',tags:['lenda','rock-folclore','mística'],historia:'La Salamanca é uma caverna mítica onde o diabo ensina a tocar instrumentos em troca da alma. Divididos popularizou uma versão rock do mito santiaguino que fundiu gêneros de forma memorável.',porQueEscuchar:'Pela energia única quando o folclore do norte encontra o rock argentino. Uma fusão que te eletriza.',artistas:['Divididos','Los Manseros Santiagueños','Cuti Carabajal'],youtube:'https://www.youtube.com/results?search_query=Divididos+La+Salamanca+Santiago+del+Estero'},
        {emoji:'🪘',nombre:'El Humahuaqueño',artista:'Edmundo Zaldívar',destacada:false,descripcion:'O carnavalito mais famoso da Argentina, criado por um santiaguino. Tocado em todo carnaval e cerimônia escolar por décadas.',tags:['carnavalito','clássico','escolar'],historia:'Composto pelo santiaguino Edmundo Zaldívar em 1942, este carnavalito tornou-se o mais executado da Argentina. Chegou aos livros escolares de música de todo o país.',porQueEscuchar:'Porque é literalmente parte do DNA musical argentino. Impossível ouvir sem mover os pés.',artistas:['Edmundo Zaldívar','Los Chalchaleros','Atahualpa Yupanqui'],youtube:'https://www.youtube.com/results?search_query=El+Humahuaqueño+carnavalito'},
        {emoji:'🎤',nombre:'Son del Pueblo',artista:'Los Manseros Santiagueños',destacada:false,descripcion:'O grupo mais longevo do folclore santiaguino. Suas coplas e chacareras são a voz dos camponeses do monte.',tags:['chacarera','copla','popular'],historia:'Los Manseros Santiagueños têm mais de 60 anos de carreira ininterrupta. Representaram Santiago em festivais do mundo todo.',porQueEscuchar:'Pela autenticidade total. Sem arranjos modernos: chacarera pura como a água do Río Dulce.',artistas:['Los Manseros Santiagueños','Los Ábalos','Cuti y Roberto Carabajal'],youtube:'https://www.youtube.com/results?search_query=Los+Manseros+Santiagueños'},
        {emoji:'🌵',nombre:'Zamba de mi Esperanza',artista:'Luis Profili / Jorge Cafrune',destacada:false,descripcion:'Uma das zambas mais belas do repertório folclórico. Um hino universal do noroeste argentino.',tags:['zamba','clássico','hino'],historia:'Composta por Luis Profili, foi Jorge Cafrune quem a popularizou massivamente nos anos 60. A zamba fala de amor, terra e esperança com uma melodia inesquecível.',porQueEscuchar:'Porque é impossível ouvi-la sem se emocionar. A melodia mais bela do folclore argentino para muitos.',artistas:['Jorge Cafrune','Mercedes Sosa','Los Chalchaleros'],youtube:'https://www.youtube.com/results?search_query=Zamba+de+mi+Esperanza+Cafrune'},
        {emoji:'🎻',nombre:'Chacarera del Exilio',artista:'Cuti Carabajal',destacada:false,descripcion:'A chacarera do desenraizamento e da migração. Um tema sobre o santiaguino que deve deixar sua terra para buscar trabalho em Buenos Aires.',tags:['chacarera','migração','identidade'],historia:'Cuti Carabajal compôs este tema nos anos 70 quando a migração interna levava milhares de santiaguinos a Buenos Aires. Tornou-se o hino dos transplantados.',porQueEscuchar:'Porque fala de raízes, identidade e o que significa carregar sua terra no coração mesmo estando longe.',artistas:['Cuti Carabajal','Roberto Carabajal','Peteco Carabajal'],youtube:'https://www.youtube.com/results?search_query=Cuti+Carabajal+Chacarera+del+Exilio'},
        {emoji:'🌟',nombre:'Llegando al Rancho',artista:'Raly Barrionuevo',destacada:false,descripcion:'A nova geração do folclore santiaguino. Raly funde a chacarera com sons contemporâneos sem perder a identidade do monte.',tags:['chacarera','contemporâneo','fusão'],historia:'Raly Barrionuevo é a figura mais importante do folclore santiaguino do século XXI. Suas produções modernas levaram a chacarera a um público jovem.',porQueEscuchar:'Para entender que o folclore não é coisa do passado. Raly prova que a chacarera pode ser tão moderna quanto qualquer gênero atual.',artistas:['Raly Barrionuevo','La Bruja Salguero','Peteco Carabajal'],youtube:'https://www.youtube.com/results?search_query=Raly+Barrionuevo+chacarera'},
        {emoji:'🏆',nombre:'Santiago del Estero',artista:'Hermanos Núñez',destacada:false,descripcion:'O hino não oficial da província. Uma chacarera que canta a terra, o rio e o povo santiaguino com orgulho e emoção.',tags:['hino','chacarera','identidade'],historia:'Os Irmãos Núñez criaram este tema que se tornou identitário para os santiaguinos de todo o país.',porQueEscuchar:'Porque ao ouvi-la você entende por que Santiago del Estero se chama "Mãe das Cidades" e por que seu povo a ama tanto.',artistas:['Hermanos Núñez','Los Manseros','Los Ábalos'],youtube:'https://www.youtube.com/results?search_query=Hermanos+Núñez+Santiago+del+Estero+chacarera'}
    ],
    de:[
        {emoji:'🎸',nombre:'La Chacarera del Rancho',artista:'Los Hermanos Ábalos',destacada:true,descripcion:'Das Stück, das Santiago del Estero weltweit definiert. Eine Hymne der santiaguinischen Chacarera vom einflussreichsten Folklorebandgruppe Argentiniens.',tags:['chacarera','folklore','klassiker'],historia:'Die Ábalos-Brüder aus Santiago del Estero popularisierten dieses Stück in den 1950er Jahren. Es war die erste Chacarera, die in Buenos Aires gespielt wurde und das Genre national etablierte.',porQueEscuchar:'Weil es die reinste Chacarera ist: Gitarre, Bombo-Leguero-Trommel und Stimmen, die nach dem santiaguinischen Buschland duften. Der Rhythmus lädt zum Tanzen ein, auch wenn man nicht weiß wie.',artistas:['Los Hermanos Ábalos','Peteco Carabajal','Chazarreta'],youtube:'https://www.youtube.com/results?search_query=Los+Hermanos+Abalos+La+Chacarera+del+Rancho'},
        {emoji:'🥁',nombre:'La Telesita',artista:'Carlos Carabajal',destacada:false,descripcion:'Die berühmteste santiaguinische Legende als Lied. Die Geschichte einer Frau, die sich zu Tode tanzte und zur Schutzpatronin der Tänzer wurde.',tags:['chacarera','legende','Carabajal'],historia:'Carlos Carabajal komponierte diese Chacarera in den 1960er Jahren basierend auf der Volkslegende von Telesita, einer jungen Frau, die vom Geist des Tanzes besessen war.',porQueEscuchar:'Wegen seiner magischen Geschichte und unwiderstehlichen Rhythmus. Sie verstehen warum Chacarera eine Trance ist wenn Sie es wirklich hören.',artistas:['Carlos Carabajal','Peteco Carabajal','Los Carabajal'],youtube:'https://www.youtube.com/results?search_query=Carlos+Carabajal+La+Telesita'},
        {emoji:'🎵',nombre:'Añoranzas',artista:'Peteco Carabajal',destacada:false,descripcion:'Die zeitgenössischste Stimme von Santiago del Estero. Ein Stück, das die Nostalgie des wandernden Santiaguinos mit einzigartiger Sensibilität einfängt.',tags:['chacarera','zeitgenössisch','nostalgie'],historia:'Peteco Carabajal, Sohn des legendären Carlos, erneuerte die santiaguinische Folklore in den 80er und 90er Jahren.',porQueEscuchar:'Wegen seiner Poesie. Peteco ist für die Folklore was Neruda für die Poesie ist: verwandelt das Alltägliche in etwas Erhabenes.',artistas:['Peteco Carabajal','Los Carabajal','Raly Barrionuevo'],youtube:'https://www.youtube.com/results?search_query=Peteco+Carabajal+Añoranzas'},
        {emoji:'🎶',nombre:'La Salamanca',artista:'Divididos / Folk-Version',destacada:false,descripcion:'Die Legende des Teufelspakts im Chaco-Buschland als Lied. Eine der dunkelsten und faszinierendsten Geschichten des Nordwestens.',tags:['legende','rock-folklore','mystisch'],historia:'La Salamanca ist eine mythische Höhle, wo der Teufel Instrumente im Tausch gegen die Seele lehrt. Divididos popularisierte eine Rock-Version des santiaguinischen Mythos.',porQueEscuchar:'Für die einzigartige Energie wenn die Folklore des Nordens auf argentinischen Rock trifft. Eine Fusion die elektrisiert.',artistas:['Divididos','Los Manseros Santiagueños','Cuti Carabajal'],youtube:'https://www.youtube.com/results?search_query=Divididos+La+Salamanca+Santiago+del+Estero'},
        {emoji:'🪘',nombre:'El Humahuaqueño',artista:'Edmundo Zaldívar',destacada:false,descripcion:'Argentiniens bekanntester Carnavalito, von einem Santiaguino geschaffen. Jahrzehntelang bei jedem Karneval und jeder Schulfeier gespielt.',tags:['carnavalito','klassiker','schule'],historia:'Von Edmundo Zaldívar 1942 komponiert, wurde dieser Carnavalito der meistgespielte Argentiniens. Er gelangte in die Schulmusikbücher des ganzen Landes.',porQueEscuchar:"Weil es buchstäblich Teil von Argentiniens musikalischem DNA ist. Unmöglich zu hören ohne die Füße zu bewegen.",artistas:['Edmundo Zaldívar','Los Chalchaleros','Atahualpa Yupanqui'],youtube:'https://www.youtube.com/results?search_query=El+Humahuaqueño+carnavalito'},
        {emoji:'🎤',nombre:'Son del Pueblo',artista:'Los Manseros Santiagueños',destacada:false,descripcion:'Die langlebigste Gruppe der santiaguinischen Folklore. Ihre Coplas und Chacareras sind die Stimme der Landbewohner.',tags:['chacarera','copla','volkstümlich'],historia:'Los Manseros Santiagueños haben über 60 Jahre ununterbrochene Karriere. Sie repräsentierten Santiago auf Festivals weltweit.',porQueEscuchar:'Für ihre totale Authentizität. Keine modernen Arrangements: reine Chacarera wie das Wasser des Río Dulce.',artistas:['Los Manseros Santiagueños','Los Ábalos','Cuti y Roberto Carabajal'],youtube:'https://www.youtube.com/results?search_query=Los+Manseros+Santiagueños'},

let _lang='es';
function cambiarIdioma(lang){
    _lang=lang;
    document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('activo',b.dataset.lang===lang));
    const ui=_ui[lang];
    document.getElementById('hdr-titulo').textContent=ui.titulo;
    document.getElementById('hdr-subtitulo').textContent=ui.subtitulo;
    renderGrid();
}
function renderGrid(){
    const ui=_ui[_lang];
    document.getElementById('grid-musica').innerHTML=_temas[_lang].map((t,i)=>`
        <div class="tarjeta${t.destacada?' destacada':''}" onclick="verTema(${i})">
            ${t.destacada?`<span class="badge-top">${ui.destacado}</span><br>`:''}
            <span class="emoji">${t.emoji}</span>
            <h2>${t.nombre}</h2>
            <div class="artista">🎤 ${t.artista}</div>
            <p class="descripcion">${t.descripcion}</p>
            <div class="tags">${t.tags.map(tg=>`<span class="tag">${tg}</span>`).join('')}</div>
            <button class="btn-ver">${ui.ver} →</button>
        </div>`).join('');
}
function verTema(idx){
    const t=_temas[_lang][idx];
    const ui=_ui[_lang];
    document.getElementById('modal-contenido').innerHTML=`
        <span class="emoji-grande">${t.emoji}</span>
        <h2>${t.nombre}</h2>
        <div class="artista-modal">🎤 ${t.artista}</div>
        <h3>${ui.historia}</h3>
        <p>${t.historia}</p>
        <h3>${ui.porQueEscluar}</h3>
        <p>${t.porQueEscuchar}</p>
        <h3>${ui.artistas}</h3>
        <ul>${t.artistas.map(a=>`<li>${a}</li>`).join('')}</ul>
        <a class="btn-youtube" href="${t.youtube}" target="_blank">${ui.verYoutube}</a>
        <button class="btn-cerrar" onclick="cerrarModal()">${ui.cerrar}</button>`;
    document.getElementById('overlay').classList.add('activo');
    document.body.style.overflow='hidden';
}
function cerrarModal(e){
    if(!e||e.target===document.getElementById('overlay')||e.target.classList.contains('btn-cerrar')){
        document.getElementById('overlay').classList.remove('activo');
        document.body.style.overflow='';
    }
}
renderGrid();
</script>

</html>
